<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Cards</title>
  <style>
    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      width: 250px;
      transition: 0.3s;
    }
    .card img {
      width: 100%;
      border-radius: 4px;
    }
    .highlighted {
      background-color: #ffffcc;
    }
  </style>
</head>
<body>

  <h1>📚 Dynamic Cards</h1>
  <div class="card-container" id="cardContainer"></div>

  <script src="Project11D.js"></script>
</body>
</html>
